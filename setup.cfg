[metadata]
name = e2e-type-converter
version = 0.1.2
description = Python类型转换兼容层，支持所有标准数据类型和第三方库类型之间的双向转换
long_description = file: README.md
long_description_content_type = text/markdown
author = John-is-playing
author_email = b297209694@outlook.com
url = https://github.com/John-is-playing/everything2everything
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Utilities
keywords = type converter, data type, python, numpy, torch, xarray, jax, tensorflow
project_urls =
    Bug Tracker = https://github.com/John-is-playing/everything2everything/issues
    Source Code = https://github.com/John-is-playing/everything2everything

[options]
python_requires = >=3.7
packages = find:
include_package_data = True

[options.extras_require]
full = 
    numpy
    cupy
    scipy
    pandas
    torch
    xarray
    jax
    tensorflow
numpy = 
    numpy
pandas = 
    pandas
    numpy
torch = 
    torch
xarray = 
    xarray
    numpy
scientific = 
    numpy
    scipy
    pandas

[options.packages.find]
where = .